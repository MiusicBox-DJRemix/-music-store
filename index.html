<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="ร้านเพลงออนไลน์ ฟังเพลงฟรี สั่งซื้อง่ายผ่าน WhatsApp">
<title>Music Store</title>
<link rel="stylesheet" href="style.css?v=4">
<style>
  /* Cart UI — intentionally scoped so the existing store styles stay unchanged. */
  .cart-toggle {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    min-height: 44px;
    border: 0;
    border-radius: 12px;
    background: var(--surface, #1f2937);
    color: var(--text, #fff);
    cursor: pointer;
  }
  .cart-toggle-label {
    margin-left: 6px;
    font-size: 13px;
    font-weight: 700;
  }
  .cart-toggle-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 19px;
    height: 19px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--accent, #ef4444);
    color: #fff;
    font-size: 11px;
    line-height: 19px;
    text-align: center;
    font-weight: 800;
  }
  .cart-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0, 0, 0, .66);
    padding: 16px;
  }
  .cart-backdrop.show { display: flex; }
  .cart-panel {
    width: min(100%, 760px);
    max-height: min(92vh, 840px);
    overflow: auto;
    border-radius: 22px 22px 14px 14px;
    background: var(--surface, #111827);
    color: var(--text, #fff);
    box-shadow: 0 20px 70px rgba(0, 0, 0, .45);
    padding: 20px;
  }
  .cart-header, .cart-summary-row, .cart-item {
    display: flex;
    align-items: center;
  }
  .cart-header {
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .cart-header h2 { margin: 0; font-size: 22px; }
  .cart-close {
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: inherit;
    font-size: 22px;
    cursor: pointer;
  }
  .cart-item {
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,.1);
  }
  .cart-item-cover {
    width: 58px;
    height: 58px;
    flex: 0 0 58px;
    border-radius: 10px;
    object-fit: cover;
    background: rgba(255,255,255,.08);
  }
  .cart-item-info { min-width: 0; flex: 1; }
  .cart-item-name {
    overflow: hidden;
    font-weight: 700;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cart-item-meta { margin-top: 3px; color: var(--text-dim, #9ca3af); font-size: 13px; }
  .cart-item-total { min-width: 92px; text-align: right; font-weight: 800; }
  .cart-remove {
    border: 0;
    cursor: pointer;
    flex: 0 0 auto;
    padding: 7px;
    background: transparent;
    color: #f87171;
    font-size: 13px;
  }
  .cart-empty { padding: 42px 16px; text-align: center; color: var(--text-dim, #9ca3af); }
  .cart-empty p { margin: 0 0 16px; }
  .cart-summary {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,.14);
  }
  .cart-summary-row { justify-content: space-between; gap: 16px; margin: 8px 0; }
  .cart-summary-total { font-size: 20px; font-weight: 900; }
  .cart-actions { display: flex; gap: 10px; margin-top: 16px; }
  .cart-actions button { flex: 1; min-height: 46px; }
  .cart-add-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 34px;
    padding: 7px 10px;
    border: 0;
    border-radius: 9px;
    background: rgba(34, 197, 94, .14);
    color: #22c55e;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
  }
  @media (min-width: 700px) {
    .cart-backdrop { align-items: center; }
    .cart-panel { border-radius: 22px; }
  }
  @media (max-width: 420px) {
    .cart-panel { padding: 16px; }
    .cart-item-total { min-width: 72px; font-size: 13px; }
    .cart-actions { flex-direction: column; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <img id="siteLogo" src="" alt="logo" style="display:none;">
        <span id="siteName">Music Store</span>
      </div>
      <button class="cart-toggle" id="cartToggleBtn" type="button" aria-label="เปิดตะกร้าสินค้า">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-toggle-label">ตะกร้า</span>
        <span class="cart-toggle-badge" id="cartBadge" hidden>0</span>
      </button>
    </div>
    <div class="container" style="padding-bottom:10px;">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="ค้นหาเพลง ศิลปิน DJ หรือหมวดหมู่...">
      </div>
    </div>
    <div class="chip-row" id="categoryChips"></div>
  </div>

  <div id="djSection">
    <div class="section-title">DJ</div>
    <div class="dj-row" id="djRow"></div>
  </div>

  <!-- ส่วน Playlist แบบ Dropdown -->
  <div class="playlist-wrapper">
    <button class="playlist-header-btn" id="playlistToggleBtn">
      <span class="playlist-header-title">เพลย์ลิสต์</span>
      <svg class="dropdown-icon" id="dropdownIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div id="playlistsContainer" class="playlist-content-box"></div>
  </div>

  <div class="section-title" id="gridTitle">เพลงทั้งหมด</div>
  <div class="song-grid" id="songGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">ไม่พบเพลงที่ค้นหา</div>

  <div class="player-bar" id="playerBar">
    <div class="player-top">
      <img id="playerCover" src="" alt="">
      <div class="player-meta">
        <div class="t1" id="playerTitle">-</div>
        <div class="t2" id="playerSub">-</div>
      </div>
      <button class="ctrl" id="playerToggle">
        <svg id="playerIcon" width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
        <div class="spinner" id="playerSpinner" style="display:none;"></div>
      </button>
    </div>
    <div class="player-seek-row">
      <span class="time" id="playerCurrentTime">0:00</span>
      <input type="range" id="playerSeek" min="0" max="100" step="0.1" value="0">
      <span class="time" id="playerDuration">0:00</span>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="active" data-tab="home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a1 1 0 01-1 1H4a1 1 0 01-1-1z"/></svg>
      หน้าแรก
    </button>
    <button data-tab="playlist">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
      เพลย์ลิสต์
    </button>
    <button data-tab="category">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      หมวดหมู่
    </button>
    <button data-tab="dj">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
      DJ
    </button>
    <button data-tab="contact">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      ติดต่อ
    </button>
  </div>

  <div class="modal-backdrop" id="songModalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h3>รายละเอียดเพลง</h3>
        <button class="modal-close" id="songModalClose">✕</button>
      </div>
      <div style="width:100%;position:relative;overflow:hidden;border-radius:14px;margin-bottom:14px;">
        <div style="padding-top:100%;"></div>
        <img id="modalCover" src="" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;">
      </div>
      <h3 id="modalName" style="margin:0 0 4px;"></h3>
      <div id="modalArtist" style="color:var(--text-dim);font-size:14px;margin-bottom:2px;"></div>
      <div id="modalDj" style="color:var(--accent-2);font-size:13px;margin-bottom:10px;"></div>
      <div id="modalDesc" style="font-size:14px;color:var(--text-dim);margin-bottom:16px;line-height:1.6;"></div>
      <div style="font-size:20px;font-weight:800;color:var(--success);margin-bottom:16px;" id="modalPrice"></div>
      <div style="display:flex;gap:10px;">
        <button class="btn secondary" id="modalPlayBtn" data-play="" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;">
          <span id="modalPlayIconWrap" style="display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;position:relative;flex-shrink:0;">
            <svg id="modalPlayIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <div class="spinner" id="modalPlaySpinner" style="display:none;width:24px;height:24px;border-width:4px;"></div>
          </span>
          <span id="modalPlayLabel">ฟังเพลง</span>
        </button>
        <button class="btn whatsapp" id="modalBuyBtn" style="flex:1;">สนใจซื้อเพลง</button>
      </div>
    </div>
  </div>

  <div class="cart-backdrop" id="cartBackdrop" aria-hidden="true">
    <section class="cart-panel" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
      <div class="cart-header">
        <h2 id="cartTitle">ตะกร้าสินค้า</h2>
        <button class="cart-close" id="cartCloseBtn" type="button" aria-label="ปิดตะกร้า">✕</button>
      </div>
      <div id="cartItems"></div>
      <div class="cart-summary" id="cartSummary" hidden>
        <div class="cart-summary-row">
          <span>จำนวนเพลงทั้งหมด</span>
          <strong id="cartTotalQuantity">0 เพลง</strong>
        </div>
        <div class="cart-summary-row cart-summary-total">
          <span>ราคารวม</span>
          <strong id="cartTotalPrice">0 LAK</strong>
        </div>
        <div class="cart-actions">
          <button class="btn secondary" id="clearCartBtn" type="button">ล้างตะกร้า</button>
          <button class="btn whatsapp" id="checkoutCartBtn" type="button">สั่งซื้อผ่าน WhatsApp</button>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <!-- สคริปต์สลับการ เปิด-ปิด Dropdown -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('playlistToggleBtn');
      const container = document.getElementById('playlistsContainer');
      const icon = document.getElementById('dropdownIcon');

      if (toggleBtn && container) {
        toggleBtn.addEventListener('click', () => {
          container.classList.toggle('is-closed');
          icon.classList.toggle('is-closed');
        });
      }
    });
  </script>

  <!-- เปลี่ยนเลข v ทุกครั้งที่อัปโหลดไฟล์ใหม่ เพื่อไม่ให้มือถือใช้ไฟล์ JS จาก cache -->
  <script type="module" src="app-user.js?v=6"></script>
</body>
</html>
