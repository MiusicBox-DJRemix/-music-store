<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="ร้านเพลงออนไลน์ ฟังเพลงฟรี สั่งซื้อง่ายผ่าน WhatsApp">
<title>Music Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <img id="siteLogo" src="" alt="logo" style="display:none;">
        <span id="siteName">Music Store</span>
      </div>
    </div>
    <div class="container" style="padding-bottom:10px;">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="ค้นหาเพลง ศิลปิน DJ หรือหมวดหมู่...">
      </div>
    </div>
    <div class="chip-row" id="categoryChips"></div>
  </div>

  <div id="djSection">
    <div class="section-title">DJ</div>
    <div class="dj-row" id="djRow"></div>
  </div>

  <!-- ส่วน Playlist แบบ Dropdown -->
  <div class="playlist-wrapper">
    <button class="playlist-header-btn" id="playlistToggleBtn">
      <span class="playlist-header-title">เพลย์ลิสต์</span>
      <svg class="dropdown-icon" id="dropdownIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div id="playlistsContainer" class="playlist-content-box"></div>
  </div>

  <div class="section-title" id="gridTitle">เพลงทั้งหมด</div>
  <div class="song-grid" id="songGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">ไม่พบเพลงที่ค้นหา</div>

  <div class="player-bar" id="playerBar">
    <div class="player-top">
      <img id="playerCover" src="" alt="">
      <div class="player-meta">
        <div class="t1" id="playerTitle">-</div>
        <div class="t2" id="playerSub">-</div>
      </div>
      <button class="ctrl" id="playerToggle">
        <svg id="playerIcon" width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
        <div class="spinner" id="playerSpinner" style="display:none;"></div>
      </button>
    </div>
    <div class="player-seek-row">
      <span class="time" id="playerCurrentTime">0:00</span>
      <input type="range" id="playerSeek" min="0" max="100" step="0.1" value="0">
      <span class="time" id="playerDuration">0:00</span>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="active" data-tab="home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a1 1 0 01-1 1H4a1 1 0 01-1-1z"/></svg>
      หน้าแรก
    </button>
    <button data-tab="category">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      หมวดหมู่
    </button>
    <button data-tab="dj">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
      DJ
    </button>
    <button data-tab="contact">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      ติดต่อ
    </button>
  </div>

  <div class="modal-backdrop" id="songModalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h3>รายละเอียดเพลง</h3>
        <button class="modal-close" id="songModalClose">✕</button>
      </div>
      <div style="width:100%;position:relative;overflow:hidden;border-radius:14px;margin-bottom:14px;">
        <div style="padding-top:100%;"></div>
        <img id="modalCover" src="" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;">
      </div>
      <h3 id="modalName" style="margin:0 0 4px;"></h3>
      <div id="modalArtist" style="color:var(--text-dim);font-size:14px;margin-bottom:2px;"></div>
      <div id="modalDj" style="color:var(--accent-2);font-size:13px;margin-bottom:10px;"></div>
      <div id="modalDesc" style="font-size:14px;color:var(--text-dim);margin-bottom:16px;line-height:1.6;"></div>
      <div style="font-size:20px;font-weight:800;color:var(--success);margin-bottom:16px;" id="modalPrice"></div>
      <div style="display:flex;gap:10px;">
        <button class="btn secondary" id="modalPlayBtn" data-play="" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;">
          <!-- กล่องครอบไอคอน/สปินเนอร์ปุ่มฟังเพลงใน modal: ขนาดกล่องขยายตามสปินเนอร์ (24px) เพื่อไม่ให้ล้นออกนอกปุ่ม -->
          <span id="modalPlayIconWrap" style="display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;position:relative;flex-shrink:0;">
            <svg id="modalPlayIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <!-- ขนาดวงกลมหมุนปุ่ม modal — แก้ width/height/border-width ตรงนี้เพื่อปรับขนาด -->
            <div class="spinner" id="modalPlaySpinner" style="display:none;width:24px;height:24px;border-width:4px;"></div>
          </span>
          <span id="modalPlayLabel">ฟังเพลง</span>
        </button>
        <button class="btn whatsapp" id="modalBuyBtn" style="flex:1;">สนใจซื้อเพลง</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- สคริปต์สลับการ เปิด-ปิด Dropdown -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('playlistToggleBtn');
      const container = document.getElementById('playlistsContainer');
      const icon = document.getElementById('dropdownIcon');

      if (toggleBtn && container) {
        toggleBtn.addEventListener('click', () => {
          container.classList.toggle('is-closed');
          icon.classList.toggle('is-closed');
        });
      }
    });
  </script>

  <script type="module" src="app-user.js"></script>
</body>
</html>
